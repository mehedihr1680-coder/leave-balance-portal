<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Leave Balance</title><style>
body{font-family:Arial;background:#f3f6fa;margin:0}.box{max-width:760px;margin:55px auto;padding:30px;background:white;border-radius:18px;box-shadow:0 8px 30px #0001}input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:10px;border-radius:10px;font-size:16px}input{border:1px solid #ccd3df}button{border:0;background:#1769e0;color:white;font-weight:bold}.row{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #eee;padding:12px 0}.k{font-weight:bold}.v{text-align:right}a{color:#1769e0}
</style></head><body><div class="box"><h1>Employee Leave Balance</h1><p>Enter Employee ID</p><input id="id" placeholder="Employee ID"><button onclick="go()">Search</button><div id="out"></div><p><a href="/admin">Admin Panel</a></p></div><script>
function e(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function go(){let id=document.getElementById('id').value.trim(),o=document.getElementById('out');if(!id)return;o.innerHTML='Searching...';let r=await fetch('/api/search?employee_id='+encodeURIComponent(id)),d=await r.json();if(!r.ok){o.innerHTML='<p>'+e(d.error)+'</p>';return}let h='<h3>Leave Information</h3>';for(let[k,v]of Object.entries(d.employee))if(v!=='')h+='<div class="row"><span class="k">'+e(k)+'</span><span class="v">'+e(v)+'</span></div>';o.innerHTML=h}document.getElementById('id').addEventListener('keydown',x=>{if(x.key==='Enter')go()});
</script></body></html>
