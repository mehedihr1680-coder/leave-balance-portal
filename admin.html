<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>
body{font-family:Arial;background:#f3f6fa;margin:0}.box{max-width:760px;margin:50px auto;padding:30px;background:white;border-radius:18px;box-shadow:0 8px 30px #0001}input,button{width:100%;box-sizing:border-box;padding:14px;margin-top:10px;border-radius:10px;font-size:16px}input{border:1px solid #ccd3df}button{border:0;background:#1769e0;color:white;font-weight:bold}.logout{background:#555}.msg{margin-top:14px;padding:10px;background:#eef4ff;border-radius:8px}#panel{display:none}a{color:#1769e0}
</style></head><body><div class="box"><h1>Admin Panel</h1><div id="login"><input id="pw" type="password" placeholder="Admin Password"><button onclick="login()">Login</button><div id="lm" class="msg"></div></div><div id="panel"><p id="count"></p><h3>Upload New Leave File</h3><p>New upload replaces ALL old data.</p><input id="file" type="file" accept=".xls,.xlsx,.csv,.txt"><button onclick="upload()">Upload & Replace All Data</button><button class="logout" onclick="logout()">Logout</button><div id="um" class="msg"></div></div><p><a href="/">← Employee Panel</a></p></div><script>
const L=document.getElementById('login'),P=document.getElementById('panel'),C=document.getElementById('count');async function init(){let r=await fetch('/api/status'),d=await r.json();if(d.logged_in)show(d.total)}function show(n){L.style.display='none';P.style.display='block';C.textContent='Current employee records: '+n}async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})}),d=await r.json();if(r.ok)show(d.total);else document.getElementById('lm').textContent=d.error}async function upload(){let f=document.getElementById('file').files[0];if(!f)return;if(!confirm('Replace ALL old data?'))return;let x=new FormData();x.append('file',f);let r=await fetch('/api/upload',{method:'POST',body:x}),d=await r.json();document.getElementById('um').textContent=d.message||d.error;if(r.ok)C.textContent='Current employee records: '+d.total}async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});init();
</script></body></html>
